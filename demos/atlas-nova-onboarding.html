<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas · Nova Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1D29;
    --surface:#242736;
    --surface-2:#2D3043;
    --line:#3A3D52;
    --text:#ECE9E2;
    --text-dim:#9A9CB0;
    --signal:#5EEAD4;
    --signal-dim:#2A4F4C;
    --habit:#FFB454;
    --habit-dim:#4A3A20;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:0.02em;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .wordmark .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 8px var(--signal);
  }
  .wordmark .sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    font-weight:400;
    margin-left:4px;
  }
  .streak{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--habit);
    background:var(--habit-dim);
    padding:6px 12px;
    border-radius:20px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  main{
    flex:1;
    display:grid;
    grid-template-columns:1.3fr 1fr;
    min-height:0;
  }
  @media (max-width:820px){
    main{grid-template-columns:1fr; grid-template-rows:auto auto;}
    .chat-col{
      border-right:none;
      border-bottom:1px solid var(--line);
      padding-bottom:8px;
    }
    .signals-col{
      border-top:1px solid var(--line);
      background:linear-gradient(180deg, rgba(94,234,212,0.04) 0%, transparent 80px);
      padding-top:36px;
      margin-top:0;
    }
  }
  .chat-col{
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--line);
    min-height:0;
  }
  .chat-log{
    flex:1;
    overflow-y:auto;
    padding:24px 28px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .msg{
    max-width:78%;
    padding:12px 16px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.5;
  }
  .msg.nova{
    background:var(--surface);
    border:1px solid var(--line);
    align-self:flex-start;
    border-bottom-left-radius:4px;
  }
  .msg.user{
    background:var(--signal-dim);
    color:var(--text);
    align-self:flex-end;
    border-bottom-right-radius:4px;
  }
  .nova-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--signal);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:6px;
  }
  .typing{
    align-self:flex-start;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
    padding:0 16px;
  }
  .input-row{
    display:flex;
    gap:10px;
    padding:18px 28px 24px;
    border-top:1px solid var(--line);
  }
  input[type=text]{
    flex:1;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
  }
  input[type=text]:focus{border-color:var(--signal);}
  button.send{
    background:var(--signal);
    color:#10231F;
    border:none;
    border-radius:10px;
    padding:0 20px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  button.send:disabled{opacity:0.4;cursor:default;}

  .signals-col{
    padding:28px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:24px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  .ring-wrap{
    display:flex;
    align-items:center;
    gap:20px;
  }
  .ring-num{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
  }
  .ring-sub{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-dim);
  }
  .steps{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .step{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--surface);
    font-size:13px;
    transition:all .4s ease;
  }
  .step.done{
    border-color:var(--signal);
    background:var(--signal-dim);
  }
  .step .check{
    width:16px;height:16px;
    border-radius:50%;
    border:1.5px solid var(--text-dim);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;
  }
  .step.done .check{
    border-color:var(--signal);
    background:var(--signal);
    color:#10231F;
  }
  .signal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .signal-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
  }
  .signal-card .val{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:700;
    color:var(--signal);
  }
  .signal-card .lbl{
    font-size:11px;
    color:var(--text-dim);
    margin-top:4px;
  }
  footer{
    padding:10px 28px;
    border-top:1px solid var(--line);
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
  }
  svg.ring{transform:rotate(-90deg);}
</style>
</head>
<body>

<header>
  <div class="wordmark"><span class="dot"></span>ATLAS <span class="sub">onboarding teammate</span></div>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="streak" id="modeBadge" style="background:var(--surface-2); color:var(--text-dim);"></span>
    <div class="streak" id="streakBadge">🔥 Loop 1</div>
  </div>
</header>

<main>
  <div class="chat-col">
    <div class="chat-log" id="chatLog"></div>
    <div class="input-row">
      <input type="text" id="userInput" placeholder="Talk to Nova about setting up Atlas..." />
      <button class="send" id="sendBtn">Send</button>
    </div>
  </div>

  <div class="signals-col">
    <div>
      <div class="eyebrow" style="margin-bottom:12px;">Engagement loop</div>
      <div class="ring-wrap">
        <svg class="ring" width="84" height="84" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="#3A3D52" stroke-width="8"/>
          <circle id="ringProgress" cx="42" cy="42" r="36" fill="none" stroke="#5EEAD4" stroke-width="8"
            stroke-dasharray="226.2" stroke-dashoffset="226.2" stroke-linecap="round"
            style="transition:stroke-dashoffset .6s ease;"/>
        </svg>
        <div>
          <div class="ring-num" id="ringPct">0%</div>
          <div class="ring-sub">setup complete</div>
        </div>
      </div>
    </div>

    <div>
      <div class="eyebrow" style="margin-bottom:10px;">Habit steps</div>
      <div class="steps" id="stepsList"></div>
    </div>

    <div>
      <div class="eyebrow" style="margin-bottom:10px;">Usage signals</div>
      <div class="signal-grid">
        <div class="signal-card">
          <div class="val" id="sigTime">0:00</div>
          <div class="lbl">time on task</div>
        </div>
        <div class="signal-card">
          <div class="val" id="sigTTV">—</div>
          <div class="lbl">time to first value</div>
        </div>
        <div class="signal-card">
          <div class="val" id="sigMsgs">0</div>
          <div class="lbl">exchanges with Nova</div>
        </div>
        <div class="signal-card">
          <div class="val" id="sigSteps">0/4</div>
          <div class="lbl">steps activated</div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  <span id="footerMode">nova-agent · in-session state</span>
  <span>built by Anup Rao</span>
</footer>

<script>
const STEPS = [
  { id: "connect", label: "Connect a data source", keywords: ["connect", "data source", "integration", "import", "sync"] },
  { id: "invite", label: "Invite a teammate", keywords: ["invite", "teammate", "colleague", "team member", "coworker"] },
  { id: "automation", label: "Set up first automation", keywords: ["automation", "automate", "workflow", "trigger", "rule"] },
  { id: "dashboard", label: "Customize your dashboard", keywords: ["dashboard", "customize", "widget", "layout", "view"] },
];

const REPLIES = {
  connect: [
    "Nice, that's the data source connected. Atlas can start pulling in records right away. Want to invite a teammate next, or jump into your first automation?",
    "Got it, connection's live. That's usually the slowest step for most teams, so you're already ahead. What's next on your list?"
  ],
  invite: [
    "Teammate invited. They'll get a link to join Atlas with you. Want to set up your first automation now, or knock out the dashboard?",
    "Done, that invite's out. Two heads catch more edge cases than one. What do you want to tackle next?"
  ],
  automation: [
    "Your first automation's set up. That's the moment Atlas actually starts saving you time instead of just sitting there. Anything else on your list?",
    "Automation's live. That's usually the step that makes people stick around, once Atlas is doing work for you, not just holding your data."
  ],
  dashboard: [
    "Dashboard's customized to how you actually want to see things. That's the last of the four. Nice work getting through setup.",
    "Looks good. Your dashboard's set up the way you want it. That wraps the setup steps, want to go again or just explore?"
  ],
  fallback: [
    "Tell me a bit more about what you did there and I'll mark it off. Or if you'd rather, just say which of the four you want to tackle: connecting a data source, inviting a teammate, an automation, or your dashboard.",
    "Not quite catching which step that was. Want to connect a data source, invite a teammate, build an automation, or customize your dashboard first?"
  ]
};

// Set this to your deployed Cloudflare Worker URL once it's live, e.g.
// "https://atlas-nova-proxy.your-subdomain.workers.dev". Until then it's
// empty and the demo runs entirely on the scripted simulation below.
const PROXY_URL = "https://atlas-nova-proxy.testemailfordev1537.workers.dev";

const SYSTEM_PROMPT = `You are Nova, the onboarding teammate inside a B2B SaaS product called Atlas (a workflow automation tool). Your job is to drive the user through setup conversationally, one thing at a time, in a warm, sharp, low-fluff voice. Never dump all steps at once.

The four setup steps, in any order the user prefers, are:
1. connect - Connect a data source
2. invite - Invite a teammate
3. automation - Set up first automation
4. dashboard - Customize your dashboard

Rules:
- Keep replies short (2-4 sentences), like a sharp colleague, not a manual.
- Mark a step complete ONLY when the user has actually described doing it (not just asking about it).
- If the user goes off-topic, gently steer back but stay friendly.
- Always respond with ONLY a JSON object, no markdown fences, no preamble, in this exact shape:
{"reply": "your conversational reply text", "step_completed": "connect" | "invite" | "automation" | "dashboard" | null}`;

let state = {
  done: {},
  msgCount: 0,
  startTime: Date.now(),
  ttv: null,
  loops: 1,
  history: [],
  liveAvailable: !!PROXY_URL,
};

function renderSteps(){
  const list = document.getElementById('stepsList');
  list.innerHTML = '';
  STEPS.forEach(s=>{
    const isDone = !!state.done[s.id];
    const el = document.createElement('div');
    el.className = 'step' + (isDone ? ' done':'');
    el.innerHTML = `<div class="check">${isDone?'✓':''}</div><div>${s.label}</div>`;
    list.appendChild(el);
  });
  const doneCount = Object.keys(state.done).length;
  document.getElementById('sigSteps').textContent = `${doneCount}/${STEPS.length}`;
  const pct = Math.round((doneCount/STEPS.length)*100);
  document.getElementById('ringPct').textContent = pct + '%';
  const circumference = 226.2;
  document.getElementById('ringProgress').style.strokeDashoffset = circumference - (circumference*pct/100);
  if(doneCount === STEPS.length){
    state.loops += 1;
    document.getElementById('streakBadge').textContent = `🔥 Loop ${state.loops}`;
    state.done = {};
    setTimeout(renderSteps, 900);
  }
}

function fmtTime(ms){
  const s = Math.floor(ms/1000);
  const m = Math.floor(s/60);
  const r = s%60;
  return `${m}:${r.toString().padStart(2,'0')}`;
}

setInterval(()=>{
  document.getElementById('sigTime').textContent = fmtTime(Date.now()-state.startTime);
}, 1000);

function addMsg(role, text){
  const log = document.getElementById('chatLog');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + (role === 'nova' ? 'nova' : 'user');
  if(role === 'nova'){
    wrap.innerHTML = `<div class="nova-label">Nova</div>${text}`;
  } else {
    wrap.textContent = text;
  }
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function showTyping(show){
  let t = document.getElementById('typingIndicator');
  if(show && !t){
    t = document.createElement('div');
    t.id = 'typingIndicator';
    t.className = 'typing';
    t.textContent = 'Nova is typing...';
    document.getElementById('chatLog').appendChild(t);
    document.getElementById('chatLog').scrollTop = document.getElementById('chatLog').scrollHeight;
  } else if(!show && t){
    t.remove();
  }
}

function matchStep(text){
  const lower = text.toLowerCase();
  for(const step of STEPS){
    if(state.done[step.id]) continue;
    if(step.keywords.some(k => lower.includes(k))){
      return step.id;
    }
  }
  return null;
}

function pickReply(stepId){
  const pool = REPLIES[stepId] || REPLIES.fallback;
  return pool[Math.floor(Math.random() * pool.length)];
}

function simulateNova(userText){
  const stepId = matchStep(userText);
  if(stepId){
    return { reply: pickReply(stepId), step_completed: stepId };
  }
  return { reply: pickReply('fallback'), step_completed: null };
}

async function callLiveNova(userText){
  state.history.push({ role: 'user', content: userText });
  const resp = await fetch(PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ system: SYSTEM_PROMPT, messages: state.history }),
  });
  if(!resp.ok) throw new Error('proxy error ' + resp.status);
  const data = await resp.json();
  const textBlock = (data.content || []).find(b => b.type === 'text');
  let raw = textBlock ? textBlock.text : '';
  raw = raw.replace(/```json|```/g, '').trim();
  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    parsed = { reply: raw || "Hmm, lost my train of thought, try that again?", step_completed: null };
  }
  state.history.push({ role: 'assistant', content: textBlock ? textBlock.text : raw });
  return parsed;
}

async function getNovaResponse(userText){
  if(state.liveAvailable){
    try{
      return await callLiveNova(userText);
    }catch(e){
      console.warn('live call failed, falling back to scripted demo', e);
      state.liveAvailable = false;
      document.getElementById('modeBadge').textContent = 'scripted fallback';
      document.getElementById('footerMode').textContent = 'nova-agent · live call unavailable, scripted fallback active';
    }
  }
  await new Promise(r => setTimeout(r, 400 + Math.random() * 400));
  return simulateNova(userText);
}

async function handleSend(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  addMsg('user', text);
  state.msgCount += 1;
  document.getElementById('sigMsgs').textContent = state.msgCount;
  showTyping(true);

  const result = await getNovaResponse(text);
  showTyping(false);
  addMsg('nova', result.reply);
  if(result.step_completed && STEPS.some(s=>s.id===result.step_completed)){
    if(!state.done[result.step_completed]){
      state.done[result.step_completed] = true;
      if(state.ttv === null){
        state.ttv = fmtTime(Date.now()-state.startTime);
        document.getElementById('sigTTV').textContent = state.ttv;
      }
      renderSteps();
    }
  }
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

document.getElementById('sendBtn').addEventListener('click', handleSend);
document.getElementById('userInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') handleSend();
});

document.getElementById('modeBadge').textContent = state.liveAvailable ? 'live' : 'scripted demo';
document.getElementById('footerMode').textContent = state.liveAvailable
  ? 'nova-agent · live model calls via proxy, in-session state'
  : 'nova-agent · scripted simulation, in-session state';
renderSteps();
addMsg('nova', "Hey, I'm Nova — I'll get you set up with Atlas. No rush and no script: just tell me what you'd like to tackle first, connecting a data source, inviting your team, building an automation, or customizing your dashboard.");
</script>

</body>
</html>
