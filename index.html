<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anup Rao — Product Manager, case studies</title>

  <meta name="description" content="Anup Rao, product manager. Six short case studies on product building: zero to one, teardowns, redesigns, go to market, saying no, and AI ranking." />
  <meta property="og:title" content="Anup Rao — Product case studies" />
  <meta property="og:description" content="Six short case studies on product decisions, not a resume." />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #18181f;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.16);
      --text: #e8e8f0;
      --text-muted: #8a8a9a;
      --text-dim: #5e5e6e;
      --accent: #6366f1;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Fraunces', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;

      --c-accent-bg: rgba(99,102,241,0.14);  --c-accent-text: #b3b6ff;
      --c-success-bg: rgba(52,211,153,0.14); --c-success-text: #7ce8bd;
      --c-warning-bg: rgba(251,191,36,0.14); --c-warning-text: #ffd76b;
      --c-danger-bg: rgba(248,113,113,0.14); --c-danger-text: #ffa3a3;
      --c-pro-bg: rgba(167,139,250,0.14);    --c-pro-text: #cdbcff;
      --c-teal-bg: rgba(34,211,238,0.14);    --c-teal-text: #79ecff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.65;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.has-cursor, body.has-cursor a, body.has-cursor button, body.has-cursor .case-card {
      cursor: none;
    }

    .container { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

    /* ── CUSTOM CURSOR ── */
    #cursor {
      position: fixed;
      top: 0; left: 0;
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(165,168,255,0.7);
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: width .16s ease, height .16s ease, background .16s ease, opacity .16s ease, border-color .16s ease;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--c-accent-text);
      white-space: nowrap;
    }
    #cursor.hover { width: 52px; height: 52px; background: var(--c-accent-bg); }
    #cursor.reading { width: 2px; height: 22px; border-radius: 2px; border: none; background: var(--c-accent-text); opacity: .8; }
    #cursor.value-ring { width: 40px; height: 40px; background: rgba(99,102,241,0.1); font-size: 13px; }
    #cursor.hidden { opacity: 0; }

    /* ── NAV ── */
    nav {
      position: sticky; top: 0; z-index: 30;
      background: rgba(10,10,15,0.82);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    nav .container { display: flex; justify-content: space-between; align-items: center; height: 64px; }
    .brand { font-family: var(--font-serif); font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
    .nav-links { display: flex; gap: 28px; font-size: 14px; color: var(--text-muted); }
    .nav-links a { color: inherit; text-decoration: none; }
    .nav-links a:hover { color: var(--text); }
    .nav-link-external { display: inline-flex; align-items: center; gap: 5px; }

    /* ── HERO ── */
    .hero { padding: 72px 0 48px; max-width: 640px; }
    .hero .kicker { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); text-transform: lowercase; margin-bottom: 14px; }
    .hero h1 { font-family: var(--font-serif); font-size: 38px; line-height: 1.25; font-weight: 600; margin-bottom: 16px; }
    .hero p { font-size: 16px; color: var(--text-muted); }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 16px;
      padding-bottom: 96px;
    }
    .case-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .case-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-strong);
      box-shadow: 0 16px 32px rgba(0,0,0,0.35);
    }
    .case-card .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .case-card .idx { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
    .case-card .tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-family: var(--font-mono); }
    .case-card h3 { font-family: var(--font-serif); font-size: 18px; font-weight: 600; margin-bottom: 8px; line-height: 1.35; }
    .case-card .hook { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; }
    .case-card .read-link { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-accent-text); margin-top: 16px; font-family: var(--font-mono); }
    .case-card .read-link svg { width: 13px; height: 13px; }

    .case-1 { grid-column: 1 / 4; grid-row: span 2; }
    .case-2 { grid-column: 4 / 7; grid-row: span 1; }
    .case-3 { grid-column: 4 / 7; grid-row: span 1; }
    .case-4 { grid-column: 1 / 4; grid-row: span 1; }
    .case-5 { grid-column: 4 / 7; grid-row: span 1; }
    .case-6 { grid-column: 1 / 7; grid-row: span 1; }
    .case-7 { grid-column: 1 / 7; grid-row: span 1; }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .case-1, .case-2, .case-3, .case-4, .case-5, .case-6, .case-7 { grid-column: 1; grid-row: auto; }
      .hero h1 { font-size: 30px; }
    }

    /* ── RUBRIC TOOL ── */
    .rubric-row { margin-bottom: 22px; }
    .rubric-row .row-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .rubric-row label { font-size: 13px; color: var(--text); font-family: var(--font-mono); }
    .rubric-pip { font-family: var(--font-mono); font-size: 12.5px; background: rgba(255,255,255,0.06); padding: 2px 9px; border-radius: 5px; display: inline-block; transition: color .15s ease; }
    .rubric-row input[type=range] { width: 100%; -webkit-appearance: none; height: 6px; border-radius: 4px; cursor: pointer; }
    .rubric-row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(255,255,255,0.08); }
    #verdict-block { display: flex; gap: 14px; padding-top: 20px; margin-top: 6px; border-top: 1px solid var(--border); transition: transform .25s ease; }
    #verdict-rail { width: 3px; border-radius: 2px; flex-shrink: 0; background: #34d399; transition: background .3s ease; }
    #rubric-verdict { font-family: var(--font-serif); font-size: 19px; font-weight: 600; margin-bottom: 12px; }
    #rubric-reasoning { font-size: 14px; line-height: 1.7; color: var(--text-muted); }
    @keyframes pip-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
    @keyframes rail-flash { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.25); } 100% { box-shadow: 0 0 0 12px rgba(255,255,255,0); } }
    .pip-hit { animation: pip-pulse .3s ease; }
    .rail-hit { animation: rail-flash .5s ease; }

    footer { border-top: 1px solid var(--border); padding: 32px 0; }
    footer .container { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-dim); }
    footer a { color: var(--text-muted); text-decoration: none; }
    footer a:hover { color: var(--text); }

    /* ── DETAIL OVERLAY ── */
    #overlay {
      position: fixed; inset: 0;
      background: rgba(5,5,8,0.55);
      display: none;
      align-items: center; justify-content: center;
      z-index: 100;
      padding: 5vh 0;
    }
    #panel {
      width: 80%;
      max-width: 760px;
      height: 86vh;
      max-height: 760px;
      display: flex;
      flex-direction: column;
      background: rgba(24,24,31,0.62);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      overflow: hidden;
    }
    #panel-header {
      flex-shrink: 0;
      padding: 22px 36px 18px;
      background: rgba(17,17,24,0.9);
      border-bottom: 1px solid var(--border);
    }
    #panel-header .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    #back-btn {
      font-family: var(--font-sans); font-size: 13px; color: var(--text-muted);
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 7px 14px; display: inline-flex; align-items: center; gap: 6px;
    }
    #back-btn:hover { color: var(--text); border-color: var(--border-strong); }
    #panel-meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
    #d-tag { font-size: 11px; padding: 4px 10px; border-radius: 6px; font-family: var(--font-mono); display: inline-block; margin-bottom: 14px; }
    #d-title { font-family: var(--font-serif); font-size: 24px; font-weight: 600; margin-bottom: 16px; line-height: 1.3; }
    #d-progress-track { height: 2px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
    #d-progress { height: 100%; width: 6%; background: var(--accent); transition: width .1s linear; }

    #panel-body { flex: 1; overflow-y: auto; padding: 28px 36px 40px; cursor: none; }
    #panel-body::-webkit-scrollbar { width: 7px; }
    #panel-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    #panel-body::-webkit-scrollbar-track { background: transparent; }
    .section-block { scroll-snap-align: start; margin-bottom: 26px; }
    .section-block:last-child { margin-bottom: 0; }
    .section-block .s-heading { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); margin-bottom: 6px; text-transform: lowercase; }
    .section-block .s-body { font-size: 15.5px; line-height: 1.75; color: var(--text); white-space: pre-line; }
    #panel-body.snap { scroll-snap-type: y proximity; }
  </style>
</head>
<body class="has-cursor">

  <div id="cursor"></div>

  <nav>
    <div class="container">
      <div class="brand">anup rao</div>
      <div class="nav-links">
        <a href="https://anuprao.dev" target="_blank" rel="noopener" class="nav-link-external">the long version
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M7 17L17 7M7 7h10v10"/></svg>
        </a>
        <a href="mailto:testemailfordev1537@gmail.com">contact</a>
        <a href="https://www.linkedin.com" target="_blank" rel="noopener">linkedin</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="hero">
      <p class="kicker">product manager</p>
      <h1>I build the thing, then write down why it worked.</h1>
      <p>six short case studies on real products. the problem they faced, the bet they made, what shipped, and what I'd have pushed back on.</p>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <footer>
    <div class="container">
      <span>anup rao, product manager</span>
      <a href="mailto:testemailfordev1537@gmail.com">say hello</a>
    </div>
  </footer>

  <div id="overlay">
    <div id="panel">
      <div id="panel-header">
        <div class="top-row">
          <button id="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            back to all cases
          </button>
          <span id="panel-meta"></span>
        </div>
        <span id="d-tag"></span>
        <h2 id="d-title"></h2>
        <div id="d-progress-track"><div id="d-progress"></div></div>
      </div>
      <div id="panel-body"></div>
    </div>
  </div>

  <script src="case-studies.js"></script>
  <script>
    const colorMap = {
      accent: ['var(--c-accent-bg)', 'var(--c-accent-text)'],
      success: ['var(--c-success-bg)', 'var(--c-success-text)'],
      warning: ['var(--c-warning-bg)', 'var(--c-warning-text)'],
      danger: ['var(--c-danger-bg)', 'var(--c-danger-text)'],
      pro: ['var(--c-pro-bg)', 'var(--c-pro-text)'],
      teal: ['var(--c-teal-bg)', 'var(--c-teal-text)']
    };

    const grid = document.getElementById('grid');
    caseStudies.forEach((c, i) => {
      const [bg, fg] = colorMap[c.color] || colorMap.accent;
      const card = document.createElement('div');
      card.className = `case-card case-${i + 1}`;
      card.innerHTML = `
        <div>
          <div class="top-row">
            <span class="idx">0${i + 1}</span>
            <span class="tag" style="background:${bg};color:${fg};">${c.tag}</span>
          </div>
          <h3>${c.title}</h3>
          <p class="hook">${c.hook}</p>
        </div>
        <div class="read-link">read the case
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        </div>
      `;
      card.addEventListener('click', () => openCase(i));
      grid.appendChild(card);
    });

    const rubricCard = document.createElement('div');
    rubricCard.className = 'case-card case-7';
    rubricCard.innerHTML = `
      <div>
        <div class="top-row">
          <span class="idx">07</span>
          <span class="tag" style="background:var(--c-accent-bg);color:var(--c-accent-text);">the rubric</span>
        </div>
        <h3>how I score a feature request</h3>
        <p class="hook">a live tool, not a write up. move five inputs, watch the verdict react.</p>
      </div>
      <div class="read-link">try it
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
      </div>
    `;
    rubricCard.addEventListener('click', openRubric);
    grid.appendChild(rubricCard);

    const overlay = document.getElementById('overlay');
    const panel = document.getElementById('panel');
    const panelBody = document.getElementById('panel-body');

    function openCase(i) {
      const c = caseStudies[i];
      const [bg, fg] = colorMap[c.color] || colorMap.accent;
      document.getElementById('d-tag').textContent = c.tag;
      document.getElementById('d-tag').style.background = bg;
      document.getElementById('d-tag').style.color = fg;
      document.getElementById('d-title').textContent = c.title;
      panelType = 'case';
      document.getElementById('panel-meta').textContent = `0${i + 1} / 0${caseStudies.length} · ${c.domain}`;
      panelBody.innerHTML = c.sections.map(s => `
        <div class="section-block">
          <p class="s-heading">${s.heading}</p>
          <p class="s-body">${s.body}</p>
        </div>
      `).join('');
      panelBody.classList.add('snap');
      panelBody.scrollTop = 0;
      document.getElementById('d-progress').style.width = '6%';
      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      document.body.classList.add('reading-mode');
    }

    let panelType = 'case';

    function closeCase() {
      overlay.style.display = 'none';
      document.body.style.overflow = '';
      document.body.classList.remove('reading-mode');
    }

    const rubricFields = [
      { id: 'reach', label: 'reach', value: 6 },
      { id: 'impact', label: 'impact', value: 6 },
      { id: 'confidence', label: 'confidence', value: 6 },
      { id: 'effort', label: 'effort', value: 5 },
      { id: 'fit', label: 'strategic fit', value: 5 }
    ];
    const rubricVals = {};
    rubricFields.forEach(f => rubricVals[f.id] = f.value);
    let lastVerdict = null;

    function colorForValue(v) { if (v <= 3) return '#f87171'; if (v <= 6) return '#fbbf24'; return '#34d399'; }
    function sliderBackground(v, color) {
      const pct = (v - 1) / 9 * 100;
      return `linear-gradient(90deg, ${color} 0%, ${color} ${pct}%, rgba(255,255,255,0.1) ${pct}%, rgba(255,255,255,0.1) 100%)`;
    }

    function updateRubric() {
      const { reach, impact, confidence, effort, fit } = rubricVals;
      const score = Math.round((reach * impact * confidence) / effort);
      const weakest = Object.entries({ reach, impact, confidence, fit }).sort((a, b) => a[1] - b[1])[0];
      let verdict, reasoning, rail;

      if (fit <= 3) {
        verdict = 'wrong product';
        reasoning = "strategic fit is the lowest number here, and no amount of reach or impact fixes that. this is probably a request for a different product, not a missing piece of this one.";
        rail = '#f87171';
      } else if (effort >= 8 && score < 20) {
        verdict = 'not worth it yet';
        reasoning = "the cost is the problem. effort is high and the upside doesn't clear the bar yet. worth revisiting if effort drops or confidence goes up, not worth forcing now.";
        rail = '#fbbf24';
      } else if (confidence <= 3) {
        verdict = 'validate before building';
        reasoning = "confidence is the weak link. the reach and impact numbers might be right, but you don't actually know that yet. spend a week de risking the guess before committing engineering time.";
        rail = '#6366f1';
      } else if (score >= 30 && fit >= 6) {
        verdict = 'build it now';
        reasoning = "reach, impact, and confidence are all solid, effort is manageable, and it fits where the product is going. nothing here is dragging the call down.";
        rail = '#34d399';
      } else if (score >= 15) {
        verdict = 'worth a small bet';
        reasoning = "this clears the bar but not by a lot. " + weakest[0] + " is the softest input. a scoped down version is the right size bet, not a full build.";
        rail = '#6366f1';
      } else {
        verdict = 'pass for now';
        reasoning = weakest[0] + " is too low to justify the effort right now. say no clearly and explain why, rather than letting it sit in the backlog unanswered.";
        rail = '#5e5e6e';
      }

      document.getElementById('rubric-verdict').textContent = verdict;
      document.getElementById('rubric-reasoning').textContent = reasoning;
      const railEl = document.getElementById('verdict-rail');
      railEl.style.background = rail;

      if (verdict !== lastVerdict) {
        const block = document.getElementById('verdict-block');
        block.style.transform = 'translateX(4px)';
        setTimeout(() => { block.style.transform = 'translateX(0)'; }, 180);
        railEl.classList.remove('rail-hit');
        requestAnimationFrame(() => railEl.classList.add('rail-hit'));
        lastVerdict = verdict;
      }
    }

    function openRubric() {
      panelType = 'rubric';
      document.getElementById('d-tag').textContent = 'the rubric';
      document.getElementById('d-tag').style.background = 'var(--c-accent-bg)';
      document.getElementById('d-tag').style.color = 'var(--c-accent-text)';
      document.getElementById('d-title').textContent = "how I'd score a feature request";
      document.getElementById('panel-meta').textContent = 'a live tool';

      const rowsHtml = rubricFields.map(f => {
        const color = colorForValue(f.value);
        return `
        <div class="rubric-row">
          <div class="row-top">
            <label>${f.label}</label>
            <span class="rubric-pip" id="${f.id}-out" style="color:${color};">${f.value}</span>
          </div>
          <input type="range" min="1" max="10" step="1" value="${f.value}" id="${f.id}" style="background:${sliderBackground(f.value, color)};" />
        </div>`;
      }).join('');

      panelBody.innerHTML = `
        ${rowsHtml}
        <div id="verdict-block">
          <div id="verdict-rail"></div>
          <div style="flex:1;">
            <p class="s-heading">verdict</p>
            <p id="rubric-verdict"></p>
            <p id="rubric-reasoning"></p>
          </div>
        </div>
      `;
      panelBody.classList.remove('snap');
      panelBody.scrollTop = 0;
      document.getElementById('d-progress').style.width = '100%';

      rubricFields.forEach(f => {
        const input = document.getElementById(f.id);
        const pip = document.getElementById(f.id + '-out');
        const row = input.closest('.rubric-row');
        input.addEventListener('input', (e) => {
          const v = Number(e.target.value);
          rubricVals[f.id] = v;
          const color = colorForValue(v);
          pip.textContent = v;
          pip.style.color = color;
          input.style.background = sliderBackground(v, color);
          pip.classList.remove('pip-hit');
          requestAnimationFrame(() => pip.classList.add('pip-hit'));
          if (cursor.classList.contains('value-ring')) cursor.textContent = v;
          updateRubric();
        });
        row.addEventListener('mouseenter', () => {
          cursor.classList.add('value-ring');
          cursor.textContent = rubricVals[f.id];
        });
        row.addEventListener('mouseleave', () => {
          cursor.classList.remove('value-ring');
          cursor.textContent = '';
        });
      });

      lastVerdict = null;
      updateRubric();

      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      document.body.classList.add('reading-mode');
    }

    document.getElementById('back-btn').addEventListener('click', closeCase);

    overlay.addEventListener('click', (e) => {
      if (!panel.contains(e.target)) closeCase();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.style.display === 'flex') closeCase();
    });

    panelBody.addEventListener('scroll', () => {
      const max = panelBody.scrollHeight - panelBody.clientHeight;
      const pct = max > 0 ? (panelBody.scrollTop / max) * 100 : 0;
      document.getElementById('d-progress').style.width = Math.max(6, Math.min(100, pct)) + '%';
    });

    /* custom cursor, desktop only */
    const cursor = document.getElementById('cursor');
    const isTouch = window.matchMedia('(pointer: coarse)').matches;
    if (isTouch) {
      document.body.classList.remove('has-cursor');
      cursor.style.display = 'none';
    } else {
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      document.querySelectorAll('.case-card').forEach(card => {
        card.addEventListener('mouseenter', () => {
          if (document.body.classList.contains('reading-mode')) return;
          cursor.classList.add('hover');
          cursor.textContent = 'open';
        });
        card.addEventListener('mouseleave', () => {
          cursor.classList.remove('hover');
          cursor.textContent = '';
        });
      });
      panelBody.addEventListener('mouseenter', () => { if (panelType === 'case') cursor.classList.add('reading'); });
      panelBody.addEventListener('mouseleave', () => { if (overlay.style.display === 'flex') cursor.classList.remove('reading'); });
      document.getElementById('panel-header').addEventListener('mouseenter', () => cursor.classList.remove('reading'));
      const observer = new MutationObserver(() => {
        if (overlay.style.display !== 'flex') {
          cursor.classList.remove('reading');
          cursor.classList.remove('value-ring');
          cursor.textContent = '';
        }
      });
      observer.observe(overlay, { attributes: true, attributeFilter: ['style'] });
    }
  </script>
</body>
</html>
